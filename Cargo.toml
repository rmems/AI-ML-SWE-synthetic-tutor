[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/rmems/AI-ML-SWE-synthetic-tutor"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tutor-schema = { path = "crates/tutor-schema" }
tutor-verify = { path = "crates/tutor-verify" }
tutor-wire = { path = "crates/tutor-wire" }
zmq = "0.10"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
